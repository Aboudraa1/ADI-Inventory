
<!-- Inventory Count Results -->
<section class="card">

    <div class="actions">
        <h2>Inventory Count Results</h2>

        <button
            id="refreshCounts"
            class="secondary"
            type="button">
            Refresh Results
        </button>
    </div>

    <p class="muted">
        View the latest counted quantity for each item.
        Previous readings remain saved in Supabase.
    </p>

    <div class="two">

        <div>
            <label for="resultsBranch">
                Select Branch
            </label>

            <select id="resultsBranch">
                <option value="">All Branches</option>
            </select>
        </div>

        <div>
            <label for="resultsCategory">
                Select Category
            </label>

            <select id="resultsCategory">
                <option value="">All Categories</option>
            </select>
        </div>

    </div>

    <p id="countResultsMessage"
       class="message"
       role="status"></p>

    <div class="tablewrap">

        <table>
            <thead>
                <tr>
                    <th>Branch</th>
                    <th>Item No.</th>
                    <th>Description</th>
                    <th>Counted Qty</th>
                    <th>Count Date</th>
                </tr>
            </thead>

            <tbody id="countResults">
                <tr>
                    <td colspan="5">
                        Loading inventory results...
                    </td>
                </tr>
            </tbody>
        </table>

    </div>

</section>
